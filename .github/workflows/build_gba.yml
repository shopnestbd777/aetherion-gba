name: Build Aetherion GBA ROM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout Aetherion Source
        uses: actions/checkout@v4

      - name: Clone Butano GBA Engine
        run: |
          git clone --depth 1 https://github.com/GValiente/butano.git /opt/butano

      - name: Compile GBA ROM
        run: |
          make -j$(nproc)

      - name: Upload Playable .gba ROM
        uses: actions/upload-artifact@v4
        with:
          name: aetherion-gba-rom
          path: "*.gba"
          
